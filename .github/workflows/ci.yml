name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: quarry_fixture
        ports: ['55322:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d quarry_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: quarry_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pfixture-only"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      QUARRY_TEST_POSTGRES_URL: postgres://postgres:fixture-only@127.0.0.1:55322/quarry_fixture
      QUARRY_TEST_MYSQL_URL: mysql://root:fixture-only@127.0.0.1:3306/quarry_fixture
      QUARRY_TEST_REDIS_URL: redis://127.0.0.1:6379
      QUARRY_TEST_DB_URL: postgresql://postgres:fixture-only@127.0.0.1:55322/quarry_browser
      QUARRY_RUST_BINARY: ${{ github.workspace }}/target/debug/qy
      QUARRY_TEST_DOCKER: '1'
      QUARRY_TEST_BINARY: ${{ github.workspace }}/target/debug/qy
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
      - name: Check browser coverage rules
        run: python3 -m unittest discover -s tests -p test_ci_browser_scope.py
      - name: Determine browser coverage
        id: browser-scope
        continue-on-error: true
        env:
          CI_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          CI_CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: python3 scripts/ci_browser_scope.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the unchanged React UI
        working-directory: web
        run: npm ci && npm run lint && npm run test:unit && npm run build
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install explicit local-runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client redis-tools openssh-client openssl
      - name: Name the disposable schema-sync source
        run: docker rename "${{ job.services.postgres.id }}" quarry-rust-core-pg
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native applications and test targets
        id: native-build
        run: cargo build --workspace --all-targets --locked
      - name: Unit, SQLite, HTTP, runtime and local-process contracts
        run: cargo test --workspace --all-targets --locked
      - name: Real PostgreSQL, MySQL and Redis contracts
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: cargo test -p quarry-core --test remote_contract --locked -- --ignored
      - name: Demonstrate direct library embedding without qy
        run: |
          cargo run -p quarry-core --example embedded_sqlite --locked
          cargo run -p quarry-service --example embedded_host --locked
      - uses: actions/setup-python@v7
        if: >-
          ${{ success() &&
              (steps.browser-scope.outcome != 'success' || steps.browser-scope.outputs.browser_required != 'false') }}
        with:
          python-version: '3.12'
      - name: Prepare native browser verification
        id: browser-prepare
        if: >-
          ${{ success() &&
              (steps.browser-scope.outcome != 'success' || steps.browser-scope.outputs.browser_required != 'false') }}
        run: |
          # Prefer Ubuntu's HTTPS archive and keep Azure as a fallback on this runner image.
          mirrors=/etc/apt/apt-mirrors.txt
          if [[ -r "$mirrors" ]] &&
             grep -Fxq $'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1' "$mirrors" &&
             grep -Fxq $'https://archive.ubuntu.com/ubuntu/\tpriority:2' "$mirrors"; then
            sudo sed -i \
              -e '/^http:\/\/azure\.archive\.ubuntu\.com\/ubuntu\/[[:blank:]]/s/priority:1$/priority:2/' \
              -e '/^https:\/\/archive\.ubuntu\.com\/ubuntu\/[[:blank:]]/s/priority:2$/priority:1/' \
              "$mirrors"
          fi
          make install
          python -m playwright install --with-deps chromium
          psql "$QUARRY_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE quarry_browser'
          psql "$QUARRY_TEST_DB_URL" -v ON_ERROR_STOP=1 -f tests/seed.sql
      - name: Existing workbench matrix against the native server
        if: ${{ success() && steps.browser-prepare.outcome == 'success' }}
        run: >-
          python -m pytest tests/test_gui_browser.py tests/test_gui_react_app.py
          tests/test_gui_browser_features.py tests/test_gui_visual.py
          -m browser -q

  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: minimum-rust
      - name: Check the declared minimum toolchain
        run: cargo check --workspace --all-targets --locked
