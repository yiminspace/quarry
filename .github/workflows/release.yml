name: Native release
on:
  push:
    tags: ['v[0-9]*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact version tag to build and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-release
  queue: max
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare a versioned release candidate from successful main CI
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="refs/heads/release/auto-$GITHUB_RUN_ID"
          existing=$(git ls-remote origin "$ref")
          if [[ -n "$existing" ]]; then
            git fetch origin "$ref"
            git switch --detach FETCH_HEAD
            tag=$(git log -1 --format=%s | sed 's/^chore(release): //')
            previous=$(git log -1 --format=%b)
          else
            if [[ "$(git rev-parse HEAD)" != "$(git ls-remote origin refs/heads/main | cut -f1)" ]]; then
              echo 'A newer main commit will be evaluated after its CI completes.'
              exit 0
            fi
            previous=$(gh release view --json tagName --jq .tagName)
            tag=$(python scripts/prepare_native_release.py "$previous")
            if [[ -z "$tag" ]]; then exit 0; fi
            python scripts/validate_release.py "$tag"
            git -c user.name=github-actions -c user.email=actions@users.noreply.github.com \
              commit -m "chore(release): $tag" -m "$previous" -- Cargo.toml Cargo.lock
            git push origin "HEAD:$ref"
          fi
          python scripts/validate_release.py "$tag"
          {
            printf 'tag=%s\n' "$tag"
            printf 'sha=%s\n' "$(git rev-parse HEAD)"
            printf 'previous=%s\n' "$previous"
          } >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    if: ${{ !cancelled() && (github.event_name != 'workflow_run' || (needs.prepare.result == 'success' && needs.prepare.outputs.tag != '')) }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha || inputs.tag || github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/validate_release.py "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || inputs.tag || github.ref_name }}
      - name: Require successful CI for the exact main commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || inputs.tag || github.ref_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          source_sha=$(git rev-parse HEAD)
          if [[ -n "$CI_SHA" ]]; then
            test "$(git rev-parse HEAD^)" = "$CI_SHA"
            test "$(git diff --name-only "$CI_SHA" HEAD)" = $'Cargo.lock\nCargo.toml'
            printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in $(seq 1 90); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$source_sha" --limit 1 --json status,conclusion --jq '.[0] | [.status,.conclusion] | @tsv')
            if [[ "$result" == $'completed\tsuccess' ]]; then
              printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$result" == completed* ]]; then echo "Exact-commit CI did not pass: $result"; exit 1; fi
            sleep 20
          done
          echo 'Timed out waiting for exact-commit CI'; exit 1

  hosted-plan:
    needs: validate
    if: ${{ !contains(needs.validate.outputs.tag, '-rc.') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - name: Reuse the exact main image build when available
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in $(seq 1 45); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow hosted-image.yml --branch main --event push --commit "$SOURCE_SHA" --limit 1 --json status,conclusion --jq '.[0] | [.status,.conclusion] | @tsv')
            case "$result" in
              $'completed\tsuccess') echo 'build=false' >> "$GITHUB_OUTPUT"; exit 0 ;;
              ''|$'\t'|$'completed\tcancelled') echo 'build=true' >> "$GITHUB_OUTPUT"; exit 0 ;;
              completed*) echo "Exact-commit Hosted image CI did not pass: $result"; exit 1 ;;
            esac
            sleep 20
          done
          echo 'Timed out waiting for exact-commit Hosted image CI'; exit 1

  hosted-image:
    needs: [validate, hosted-plan]
    if: needs.hosted-plan.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/hosted-image.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, asset: linux-x86_64, container: 'quay.io/pypa/manylinux_2_28_x86_64'}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64, container: 'quay.io/pypa/manylinux_2_28_aarch64'}
          - {os: macos-15, target: aarch64-apple-darwin, asset: macos-arm64}
          - {os: macos-15-intel, target: x86_64-apple-darwin, asset: macos-x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
      LINUX_BUILDER: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/validate_release.py "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@1.98.1
        if: runner.os == 'macOS'
      - name: Build macOS native executable
        if: runner.os == 'macOS'
        run: cargo build --locked --release -p quarry-cli --target "$TARGET"
      - name: Build Linux native executable against glibc 2.28
        if: runner.os == 'Linux'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e TARGET -e HOME=/tmp -e CARGO_HOME=/tmp/cargo -e RUSTUP_HOME=/tmp/rustup \
            "$LINUX_BUILDER" bash -euo pipefail -c '
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
              "$CARGO_HOME/bin/cargo" build --locked --release -p quarry-cli --target "$TARGET"
            '
      - name: Package native release archive
        run: python scripts/package_release.py --asset "$ASSET" --binary "target/$TARGET/release/qy" --output dist
      - name: Verify macOS archive
        if: runner.os == 'macOS'
        run: python scripts/verify_install.py dist
      - name: Verify Linux archive on glibc 2.28
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work \
            "$LINUX_BUILDER" /opt/python/cp312-cp312/bin/python scripts/verify_install.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [prepare, validate, build, hosted-image]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (github.event_name != 'workflow_run' || needs.hosted-image.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          notes=(--notes-file docs/release-notes.md)
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            python scripts/validate_release.py "$RELEASE_TAG"
            latest=$(gh release view --json tagName --jq .tagName)
            if [[ "$latest" != "$PREVIOUS_TAG" && "$latest" != "$RELEASE_TAG" ]]; then
              echo "Stable release advanced to $latest while preparing $RELEASE_TAG"
              exit 1
            fi
            # The candidate archives have passed installation and workspace
            # verification on every platform. Publish those exact archives.
            existing=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG")
            if [[ -n "$existing" ]]; then
              test "${existing%%$'\t'*}" = "$(git rev-parse HEAD)"
            else
              git push origin "HEAD:refs/tags/$RELEASE_TAG"
            fi
            notes=(--generate-notes --notes-start-tag "$PREVIOUS_TAG")
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then prerelease=(--prerelease); fi
          if release=$(gh release view "$RELEASE_TAG" --json assets,isDraft); then
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              # Recover a create attempt that stopped while uploading assets.
              gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
              gh release edit "$RELEASE_TAG" --draft=false
            else
              # Keep the original published executables and checksums on a retry.
              assets=$(jq -r '.assets[].name' <<< "$release")
              for file in dist/*.tar.gz dist/SHA256SUMS; do
                if ! grep -Fxq "${file##*/}" <<< "$assets"; then
                  echo "Existing release $RELEASE_TAG is missing ${file##*/}" >&2
                  exit 1
                fi
              done
            fi
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag \
              "${prerelease[@]}" --title "Quarry $RELEASE_TAG" "${notes[@]}"
          fi

  publish-hosted-release:
    needs: [validate, hosted-plan, hosted-image, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.hosted-plan.result == 'success' && (needs.hosted-image.result == 'success' || needs.hosted-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Verify anonymous pulls and publish the hosted release descriptor
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          # This job does not log in to GHCR. Confirm the tagged index and both
          # architectures can be pulled as a public deployment would pull them.
          repo="ghcr.io/$GITHUB_REPOSITORY"
          image="$repo:sha-$SOURCE_SHA"
          docker buildx imagetools inspect --raw "$image" > "$RUNNER_TEMP/hosted-image.json"
          for arch in amd64 arm64; do
            digest=$(jq -er --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
              | if length == 1 then .[0] else error("expected one linux/" + $arch + " manifest") end
            ' "$RUNNER_TEMP/hosted-image.json")
            docker pull --platform "linux/$arch" "$repo@$digest"
            actual=$(docker image inspect --format '{{.Os}}/{{.Architecture}} {{index .Config.Labels "org.opencontainers.image.revision"}}' "$repo@$digest")
            test "$actual" = "linux/$arch $SOURCE_SHA"
          done

          descriptor="$RUNNER_TEMP/hosted-release.json"
          jq -n --arg version "${RELEASE_TAG#v}" --arg image "$image" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            '{version: $version, image: $image, releaseNotesUrl: $notes}' > "$descriptor"
          exists=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq 'any(.assets[]; .name == "hosted-release.json")')
          if [[ "$exists" == true ]]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern hosted-release.json --output "$RUNNER_TEMP/previous-hosted-release.json"
            cmp "$descriptor" "$RUNNER_TEMP/previous-hosted-release.json"
          else
            gh release upload "$RELEASE_TAG" "$descriptor" --repo "$GITHUB_REPOSITORY"
          fi

  finish:
    needs: publish-hosted-release
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove the completed candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/auto-$GITHUB_RUN_ID"
