name: Native release
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Exact version tag to build and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/validate_release.py '${{ inputs.tag || github.ref_name }}'
      - name: Require successful CI for the exact main commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha=$(git rev-parse HEAD)
          for attempt in $(seq 1 90); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$source_sha" --limit 1 --json status,conclusion --jq '.[0] | [.status,.conclusion] | @tsv')
            if [[ "$result" == $'completed\tsuccess' ]]; then
              printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$result" == completed* ]]; then echo "Exact-commit CI did not pass: $result"; exit 1; fi
            sleep 20
          done
          echo 'Timed out waiting for exact-commit CI'; exit 1

  hosted-plan:
    needs: validate
    if: ${{ !contains(inputs.tag || github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - name: Reuse the exact main image build when available
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          for attempt in $(seq 1 45); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow hosted-image.yml --branch main --event push --commit "$SOURCE_SHA" --limit 1 --json status,conclusion --jq '.[0] | [.status,.conclusion] | @tsv')
            case "$result" in
              $'completed\tsuccess') echo 'build=false' >> "$GITHUB_OUTPUT"; exit 0 ;;
              ''|$'\t'|$'completed\tcancelled') echo 'build=true' >> "$GITHUB_OUTPUT"; exit 0 ;;
              completed*) echo "Exact-commit Hosted image CI did not pass: $result"; exit 1 ;;
            esac
            sleep 20
          done
          echo 'Timed out waiting for exact-commit Hosted image CI'; exit 1

  hosted-image:
    needs: [validate, hosted-plan]
    if: needs.hosted-plan.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/hosted-image.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, asset: linux-x86_64, manylinux: '2_28'}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64, manylinux: '2_28'}
          - {os: macos-15, target: aarch64-apple-darwin, asset: macos-arm64, manylinux: 'off'}
          - {os: macos-15-intel, target: x86_64-apple-darwin, asset: macos-x86_64, manylinux: 'off'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/validate_release.py '${{ inputs.tag || github.ref_name }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: 1.98.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - run: python scripts/package_release.py --asset '${{ matrix.asset }}' --output dist
      - name: Fresh install and Python upgrade acceptance
        run: python scripts/verify_install.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: dist
          merge-multiple: true
      - run: mkdir wheels && cp dist/*.whl wheels/
      - name: Publish platform wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true
          attestations: true
          # Archives/checksums are GitHub assets, not Python distributions.
          verbose: true
        env:
          TWINE_NON_INTERACTIVE: '1'
      - name: Publish GitHub release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          prerelease=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then prerelease=(--prerelease); fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag "${prerelease[@]}" --title "Quarry $RELEASE_TAG" --notes-file docs/release-notes.md
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber

  publish-hosted-release:
    needs: [validate, hosted-plan, hosted-image, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.hosted-plan.result == 'success' && (needs.hosted-image.result == 'success' || needs.hosted-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Verify anonymous pulls and publish the hosted release descriptor
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          # This job does not log in to GHCR. Confirm the tagged index and both
          # architectures can be pulled as a public deployment would pull them.
          repo="ghcr.io/$GITHUB_REPOSITORY"
          image="$repo:sha-$SOURCE_SHA"
          docker buildx imagetools inspect --raw "$image" > "$RUNNER_TEMP/hosted-image.json"
          for arch in amd64 arm64; do
            digest=$(jq -er --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
              | if length == 1 then .[0] else error("expected one linux/" + $arch + " manifest") end
            ' "$RUNNER_TEMP/hosted-image.json")
            docker pull --platform "linux/$arch" "$repo@$digest"
            actual=$(docker image inspect --format '{{.Os}}/{{.Architecture}} {{index .Config.Labels "org.opencontainers.image.revision"}}' "$repo@$digest")
            test "$actual" = "linux/$arch $SOURCE_SHA"
          done

          descriptor="$RUNNER_TEMP/hosted-release.json"
          jq -n --arg version "${RELEASE_TAG#v}" --arg image "$image" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            '{version: $version, image: $image, releaseNotesUrl: $notes}' > "$descriptor"
          exists=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq 'any(.assets[]; .name == "hosted-release.json")')
          if [[ "$exists" == true ]]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern hosted-release.json --output "$RUNNER_TEMP/previous-hosted-release.json"
            cmp "$descriptor" "$RUNNER_TEMP/previous-hosted-release.json"
          else
            gh release upload "$RELEASE_TAG" "$descriptor" --repo "$GITHUB_REPOSITORY"
          fi

  publish-mcp:
    needs: publish
    if: ${{ !contains(inputs.tag || github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/prepare_mcp_release.py --tag '${{ inputs.tag || github.ref_name }}' --output "$RUNNER_TEMP/server.json"
      - name: Install verified MCP publisher
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mcp-publisher.tar.gz" https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - run: '"$RUNNER_TEMP/mcp-publisher" publish "$RUNNER_TEMP/server.json"'
