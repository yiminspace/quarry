[package]
name = "quarry-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "qy"
path = "src/main.rs"

[dependencies]
quarry-service = { path = "../../crates/quarry-service" }
quarry-core = { path = "../../crates/quarry-core" }
quarry-runtime = { path = "../../crates/quarry-runtime" }
quarry-local = { path = "../../crates/quarry-local" }
quarry-assistant = { path = "../../crates/quarry-assistant" }
quarry-platform = { path = "../../crates/quarry-platform" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
clap.workspace = true
axum.workspace = true
tower-http.workspace = true
futures-util.workspace = true
async-trait.workspace = true
uuid.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
toml.workspace = true
include_dir = "0.7"
mime_guess = "2"
percent-encoding = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
sha2.workspace = true
shell-words = "1"
csv = "1"
regex = "1"
semver = "1"
rpassword = "7"
fs2.workspace = true
tempfile.workspace = true
libc = "0.2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
rusqlite.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
