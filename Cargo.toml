[workspace]
members = ["crates/*", "apps/qy", "apps/server"]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/yiminspace/quarry"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots"] }
rusqlite = { version = "0.32.1", features = ["bundled", "hooks", "column_decltype"] }
toml = "0.8"
toml_edit = "0.22"
fs2 = "0.4"
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
