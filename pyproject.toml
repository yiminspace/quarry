[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "quarry-db"
version = "2.0.1rc1"
description = "Native database workbench: shared Rust kernel, CLI, GUI and MCP"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "yiminlab" }]
classifiers = ["Programming Language :: Rust", "Topic :: Database"]
dependencies = []

[project.urls]
Homepage = "https://yiminspace.github.io/quarry/"
Repository = "https://github.com/yiminspace/quarry"
Issues = "https://github.com/yiminspace/quarry/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pymysql[rsa]>=1.1", "hatchling"]
e2e = ["pytest>=8", "playwright>=1.40"]

[tool.maturin]
manifest-path = "apps/qy/Cargo.toml"
bindings = "bin"
strip = true
include = ["src/quarry/web_dist/**/*", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: one-line reason for every skip/xfail at the end (see what the env gated).
# --strict-markers: a typo'd marker is an error, not a silent no-op.
addopts = "-ra --strict-markers --tb=short --durations=10"
markers = [
    "unit: pure logic; no DB, network, or subprocess",
    "integration: in-process against a real database engine",
    "e2e: drives a real qy CLI / GUI server / MCP subprocess",
    "browser: drives the real GUI frontend in a headless browser (Playwright)",
]

[tool.coverage.run]
source = ["quarry"]
branch = true
# subprocess-launched code (qy CLI / MCP) is covered in-process by the
# integration suites, so we don't need coverage's multiprocess plumbing.

[tool.coverage.report]
# The 95% gate applies to unit + integration (see `make cov`). Frontend JS lives
# in web/ and is exercised by the browser suite, not by
# line coverage. Defensive/unreachable lines are excluded explicitly.
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def main\\(",
    "if TYPE_CHECKING:",
    "# unreachable",          # dead line after err(..., exit_code=) which always raises
    "\\.\\.\\.",
]
omit = ["*/quarry/__main__.py"]
